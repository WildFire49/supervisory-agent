services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: supervisory-postgres
    environment:
      POSTGRES_USER: vaishakh
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supervisory_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaishakh -d supervisory_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Supervisory Agent Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: supervisory-app
    ports:
      - "8000:8000"
    environment:
      # Database connection (using container name)
      DATABASE_URL: "postgresql://vaishakh:postgres@postgres:5432/supervisory_agent"
      # From your .env file
      LLM_MODEL_NAME: "gpt-4o"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      MCP_API_KEY: "your-secret-api-key-here"
      OPENWEATHER_API_KEY: "74706eaf6321fc1768bc2fc07ead79c2"
      MCP_SERVER_URL: "http://localhost:8001"
      DASHBOARD_AGENT_URL: "http://13.201.208.156:8000/dashboard-agent"
      CREDIT_ANALYSIS_URL: "http://13.201.208.156:8200/analyze_credit"
      RULE_SAVER_URL: "http://13.201.208.156:8200/rule_saver"
      CHROMA_HOST: "3.6.132.24"
      CHROMA_PORT: "8000"
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: "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"
      LANGCHAIN_PROJECT: "supervisory-agent"
      LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
      SENTRY_DSN: "https://067bd6a1e9a47acf14b3b1134150ba22@o4509716558970880.ingest.de.sentry.io/4509716575551568"
      ENVIRONMENT: "development"
      APP_VERSION: "1.0.0"
      DEBUG: "true"
      LOG_LEVEL: "INFO"
      LANGFUSE_PUBLIC_KEY: "pk-lf-b2aa2afc-eb56-4da1-ae7a-83f199871a26"
      LANGFUSE_SECRET_KEY: "sk-lf-627a2912-bd7c-4aa3-ae32-8f0cd0de0db8"
      LANGFUSE_HOST: "https://cloud.langfuse.com"
      LANGFUSE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
