version: "3.8"

services:
  # Supervisory Agent Application
  agent-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # Override service URLs to use Docker network hostnames
      - DATABASE_URL=postgresql://user:password@postgres-db:5432/agent_db
      - MCP_SERVER_URL=http://mcp-server:8001
    depends_on:
      postgres-db:
        condition: service_healthy
      mcp-server:
        condition: service_started
    networks:
      - app-network

  # MCP Server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    networks:
      - app-network

  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agent_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
